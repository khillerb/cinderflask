name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Verify generated resources are up to date
        run: |
          ./gradlew runDatagen
          git diff --exit-code -- src/main/generated

      - name: Verify committed textures match the generator
        run: |
          python -m pip install --quiet pillow
          python tools/gen_textures.py
          git diff --exit-code -- src/main/resources/assets/cinderflask docs

      - uses: actions/upload-artifact@v4
        with:
          name: cinderflask
          path: build/libs/*.jar
