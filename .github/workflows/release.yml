name: release

# Tag a commit `v1.0.0` and push it to cut a release. Nothing publishes until the ids and tokens
# below exist, so the workflow is safe to merge before the projects are claimed:
#
#   Repository variables : MODRINTH_ID, CURSEFORGE_ID
#   Repository secrets   : MODRINTH_TOKEN, CURSEFORGE_TOKEN
#
# mc-publish skips any platform whose id or token is empty, and reads the loader, game version and
# dependency list straight out of fabric.mod.json.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          files: build/libs/!(*-sources).jar
          name: Cinderflask ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          changelog-file: CHANGELOG.md
